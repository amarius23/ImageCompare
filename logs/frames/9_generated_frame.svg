<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 600' width='960' height='600'>
  <rect width='960' height='600' fill='white'/>
  <!-- Outer furniture box -->
  <rect x='180' y='50' width='600' height='500' fill='none' stroke='#111' stroke-width='2.5'/>
  <!-- Main full-height vertical divider -->
  <line x1='480' y1='50' x2='480' y2='550' stroke='#111' stroke-width='2.0'/>
  <!-- Main horizontal section dividers -->
  <line x1='180' y1='250' x2='780' y2='250' stroke='#111' stroke-width='2.0'/>
  <line x1='180' y1='470' x2='780' y2='470' stroke='#111' stroke-width='2.0'/>

  <!-- Top left closed door -->
  <rect x='188' y='58' width='284' height='184' fill='none' stroke='#333' stroke-width='1.2'/>
  <!-- Top right closed door -->
  <rect x='488' y='58' width='284' height='184' fill='none' stroke='#333' stroke-width='1.2'/>

  <!-- Middle left open bay -->
  <line x1='180' y1='410' x2='480' y2='410' stroke='#333' stroke-width='1.2'/>
  <line x1='180' y1='430' x2='480' y2='430' stroke='#333' stroke-width='1.2'/>

  <!-- Middle right open bay -->
  <line x1='480' y1='410' x2='780' y2='410' stroke='#333' stroke-width='1.2'/>
  <line x1='480' y1='430' x2='780' y2='430' stroke='#333' stroke-width='1.2'/>

  <!-- Bottom left closed door -->
  <rect x='188' y='478' width='284' height='64' fill='none' stroke='#333' stroke-width='1.2'/>
  <!-- Bottom right closed door -->
  <rect x='488' y='478' width='284' height='64' fill='none' stroke='#333' stroke-width='1.2'/>

  <!-- Plinth -->
  <rect x='180' y='550' width='600' height='10' fill='none' stroke='#333' stroke-width='1.2'/>
</svg>