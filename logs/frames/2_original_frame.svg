<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect width="960" height="600" fill="white"/>

  <!-- Main furniture box -->
  <rect x="50" y="120" width="860" height="340" fill="none" stroke="#111" stroke-width="2.5"/>

  <!-- Full-height section dividers -->
  <line x1="220" y1="120" x2="220" y2="460" stroke="#111" stroke-width="2.0"/>
  <line x1="420" y1="120" x2="420" y2="460" stroke="#111" stroke-width="2.0"/>
  <line x1="615" y1="120" x2="615" y2="460" stroke="#111" stroke-width="2.0"/>
  <line x1="755" y1="120" x2="755" y2="460" stroke="#111" stroke-width="2.0"/>
  <line x1="845" y1="120" x2="845" y2="460" stroke="#111" stroke-width="2.0"/>

  <!-- Section 1: closed doors -->
  <line x1="135" y1="120" x2="135" y2="460" stroke="#333" stroke-width="1.2"/>
  <rect x="58" y="128" width="69" height="324" fill="none" stroke="#333" stroke-width="1.2"/>
  <rect x="143" y="128" width="69" height="324" fill="none" stroke="#333" stroke-width="1.2"/>

  <!-- Section 2: open shelf with top bay + vertical dividers -->
  <line x1="220" y1="185" x2="420" y2="185" stroke="#333" stroke-width="1.2"/>
  <line x1="255" y1="185" x2="255" y2="460" stroke="#333" stroke-width="1.2"/>
  <line x1="295" y1="185" x2="295" y2="460" stroke="#333" stroke-width="1.2"/>
  <line x1="335" y1="185" x2="335" y2="460" stroke="#333" stroke-width="1.2"/>
  <line x1="375" y1="185" x2="375" y2="460" stroke="#333" stroke-width="1.2"/>

  <!-- Section 3: mixed open left + large lower panel -->
  <line x1="420" y1="185" x2="615" y2="185" stroke="#333" stroke-width="1.2"/>
  <line x1="470" y1="185" x2="470" y2="460" stroke="#333" stroke-width="1.2"/>
  <line x1="420" y1="290" x2="470" y2="290" stroke="#333" stroke-width="1.2"/>
  <rect x="478" y="192" width="129" height="260" fill="none" stroke="#333" stroke-width="1.2"/>

  <!-- Section 4: panel/drawer style single large lower front -->
  <line x1="615" y1="185" x2="755" y2="185" stroke="#333" stroke-width="1.2"/>
  <rect x="623" y="192" width="124" height="260" fill="none" stroke="#333" stroke-width="1.2"/>

  <!-- Section 5: open bay top + lower drawer -->
  <line x1="755" y1="185" x2="845" y2="185" stroke="#333" stroke-width="1.2"/>
  <line x1="755" y1="290" x2="845" y2="290" stroke="#333" stroke-width="1.2"/>
  <rect x="763" y="298" width="74" height="154" fill="none" stroke="#333" stroke-width="1.2"/>

  <!-- Section 6: closed doors -->
  <line x1="877.5" y1="120" x2="877.5" y2="460" stroke="#333" stroke-width="1.2"/>
  <rect x="853" y="128" width="20.5" height="324" fill="none" stroke="#333" stroke-width="1.2"/>
  <rect x="881.5" y="128" width="20.5" height="324" fill="none" stroke="#333" stroke-width="1.2"/>

  <!-- Plinth -->
  <rect x="50" y="460" width="860" height="12" fill="none" stroke="#333" stroke-width="1.2"/>

  <!-- Labels -->
  <text x="135" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#444">S1 closed_doors 19.8%</text>
  <text x="320" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#444">S2 open_shelf 23.3%</text>
  <text x="517.5" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#444">S3 mixed 22.7%</text>
  <text x="685" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#444">S4 panel 16.3%</text>
  <text x="800" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#444">S5 mixed 10.5%</text>
  <text x="877.5" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#444">S6 closed 7.4%</text>
</svg>